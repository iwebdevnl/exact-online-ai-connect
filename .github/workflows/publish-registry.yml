# Publishes server.json to the MCP Registry. mcp-publisher is distributed as a
# GitHub release binary (not an npm package). This job only runs on a v* tag push
# or a manual dispatch, so it never blocks normal PR/main pushes.
name: publish-registry
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m)
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Login and publish server.json
        run: |
          ./mcp-publisher login dns --domain iwebdevelopment.com --private-key "${MCP_REGISTRY_DNS_KEY}"
          ./mcp-publisher publish
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
